[package]
name = "lma_app"
version = "0.1.0"
description = "Live Meeting Assistant"
edition.workspace = true
license.workspace = true
rust-version = "1.90"

[lib]
name = "lma_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2" }
